<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade Journal Pro</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Trade Journal Pro</h1>
        <p class="muted">Trading analytics dashboard</p>
        <button id="logoutBtn" class="ghost hidden">Logout</button>
      </aside>

      <main class="main">
        <section id="authSection" class="card">
          <h2>Welcome</h2>
          <p>Track your trades, monitor P&L, and build consistency.</p>

          <div class="tabs">
            <button class="tab active" data-tab="login">Login</button>
            <button class="tab" data-tab="register">Register</button>
          </div>

          <form id="loginForm" class="form">
            <label>Email <input type="email" name="email" required /></label>
            <label>Password <input type="password" name="password" required /></label>
            <button type="submit">Login</button>
          </form>

          <form id="registerForm" class="form hidden">
            <label>Name <input type="text" name="name" required /></label>
            <label>Email <input type="email" name="email" required /></label>
            <label>Password <input type="password" name="password" required minlength="6" /></label>
            <label>Starting Balance <input type="number" name="startingBalance" value="10000" /></label>
            <button type="submit">Create Account</button>
          </form>
        </section>

        <section id="appSection" class="hidden">
          <div class="grid">
            <article class="card stat">
              <h3>Net P&L</h3>
              <p id="netPnl" class="num">$0.00</p>
            </article>
            <article class="card stat">
              <h3>Win Rate</h3>
              <p id="winRate" class="num">0%</p>
            </article>
            <article class="card stat">
              <h3>Total Trades</h3>
              <p id="totalTrades" class="num">0</p>
            </article>
            <article class="card stat">
              <h3>Account Equity</h3>
              <p id="equity" class="num">$0.00</p>
            </article>
          </div>

          <section class="card">
            <h3>Add Trade</h3>
            <form id="tradeForm" class="form grid-form">
              <label>Symbol <input type="text" name="symbol" placeholder="AAPL" required /></label>
              <label>Side
                <select name="side" required>
                  <option value="long">Long</option>
                  <option value="short">Short</option>
                </select>
              </label>
              <label>Entry <input type="number" step="0.01" name="entry" required /></label>
              <label>Exit <input type="number" step="0.01" name="exit" required /></label>
              <label>Size <input type="number" step="1" name="size" required /></label>
              <label>Date <input type="date" name="date" required /></label>
              <label class="wide">Notes <input type="text" name="notes" placeholder="Setup, execution notes..." /></label>
              <button type="submit" class="wide">Save Trade</button>
            </form>
          </section>

          <section class="card">
            <h3>Trade History</h3>
            <table>
              <thead>
                <tr>
                  <th>Date</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>Size</th><th>P&L</th><th></th>
                </tr>
              </thead>
              <tbody id="tradeRows"></tbody>
            </table>
          </section>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/app.js"></script>
  </body>
</html>
